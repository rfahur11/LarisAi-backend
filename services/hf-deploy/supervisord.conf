[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

[program:pos-service]
command=/app/pos/pos-server
directory=/app/pos
autostart=true
autorestart=true
priority=20
environment=
    PORT="8080",
    MONGO_URI="%(ENV_MONGODB_ATLAS_URI)s",
    MONGO_DB_NAME="%(ENV_MONGODB_POS_DB_NAME)s",
    MIDTRANS_SERVER_KEY="%(ENV_MIDTRANS_SERVER_KEY)s",
    WHATSAPP_SERVICE_URL="http://127.0.0.1:8002/api/v1/whatsapp/send"
stdout_logfile=/var/log/supervisor/pos.log
stderr_logfile=/var/log/supervisor/pos_err.log

[program:ai-engine]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/ai-engine
autostart=true
autorestart=true
priority=20
environment=
    PORT="8001",
    MONGODB_URI="%(ENV_MONGODB_ATLAS_URI)s",
    MONGODB_DB_NAME="%(ENV_MONGODB_AI_DB_NAME)s",
    WHATSAPP_SERVICE_URL="http://127.0.0.1:8002/api/v1/whatsapp/send",
    WHATSAPP_TEST_DESTINATION="%(ENV_WHATSAPP_TEST_DESTINATION)s"
stdout_logfile=/var/log/supervisor/ai-engine.log
stderr_logfile=/var/log/supervisor/ai_err.log

[program:whatsapp-service]
command=node dist/index.js
directory=/app/whatsapp
autostart=true
autorestart=true
priority=20
environment=
    PORT="8002"
stdout_logfile=/var/log/supervisor/whatsapp.log
stderr_logfile=/var/log/supervisor/whatsapp_err.log
