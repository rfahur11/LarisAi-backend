user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Upstream backends
    upstream pos_backend {
        server 127.0.0.1:8080;
    }

    upstream ai_backend {
        server 127.0.0.1:8001;
    }

    upstream wa_backend {
        server 127.0.0.1:8002;
    }

    server {
        listen 7860;
        server_name _;

        # CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health check endpoint
        location /health {
            return 200 '{"status":"ok","services":["pos","ai-engine","whatsapp"]}';
            add_header Content-Type application/json;
        }

        # AI Engine routes
        location /api/v1/ai/ {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # WhatsApp Service routes
        location /api/v1/whatsapp/ {
            proxy_pass http://wa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # POS Service - all other /api/v1/ routes (auth, users, products, transactions, etc.)
        location /api/v1/ {
            proxy_pass http://pos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Default fallback
        location / {
            return 200 '{"name":"LarisAI Backend","version":"1.0.0"}';
            add_header Content-Type application/json;
        }
    }
}
